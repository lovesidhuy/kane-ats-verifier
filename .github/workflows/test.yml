name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/ -v
      - name: Claims and evidence index
        run: |
          python3 scripts/evidence_index.py
          python3 scripts/check_claims.py
      - name: Closed-loop replay (0 credits)
        run: |
          python3 scripts/kane_loop.py --replay --save-evidence --run-id ci_replay
