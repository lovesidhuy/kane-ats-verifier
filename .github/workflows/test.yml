name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Demo, tests and real claims gate (read-only official evidence)
        run: ./kane-ats demo
      - name: Repeated judge runs leave a clean checkout
        run: |
          find evidence/loop_runs -type d | sort > /tmp/official-dirs-before.txt
          for iteration in 1 2; do
            ./kane-ats heal > /tmp/heal-$iteration.log 2>&1
            ./scripts/run_kane_verify.sh loop > /tmp/loop-$iteration.log 2>&1
          done
          python3 scripts/check_claims.py
          find evidence/loop_runs -type d | sort > /tmp/official-dirs-after.txt
          diff /tmp/official-dirs-before.txt /tmp/official-dirs-after.txt
          git diff --exit-code
          test -z "$(git status --porcelain)"
